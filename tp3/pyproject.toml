[project]
name = "tp3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guilhermeanunes", email = "guilhermeaugustonunes.2005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
]

[project.scripts]
tp3 = "tp3:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]